[build]
  publish = "site"

# No build step. Static HTML and CSS only.
# _archive/ sits outside `publish` and is never deployed.

# HTTPS and canonical host — no rules needed.
# Netlify's edge 301s http -> https as soon as the certificate exists, and
# redirects the non-primary host (www) to the primary one. Both happen
# before any [[redirects]] here are evaluated, so a `from = "http://…"`
# rule never matches. Verified 2026-09-14. Do not add one.

[[headers]]
  for = "/*"
  [headers.values]
    # HSTS: one year, covering subdomains. Deliberately no `preload` —
    # client sites will live on subdomains and a preload-list entry is
    # effectively irreversible for months.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Fingerprint-free assets: revalidate HTML, cache the rest hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No canonical redirects needed: Netlify already serves /pricing from
# pricing.html and 301s /pricing.html -> /pricing (and /index.html -> /).
# Adding forced rules for that here can loop against the same internal
# resolution, so it is deliberately left to the platform default.
