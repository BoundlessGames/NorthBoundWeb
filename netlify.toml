[build]
  publish = "site"

# No build step. Static HTML and CSS only.
# _archive/ sits outside `publish` and is never deployed.

# Force HTTPS and a single canonical host.
# Verified 2026-09-14: Netlify's edge already 301s http -> https before
# these rules are evaluated, so a `from = "http://…"` rule never matches.
# http://www therefore still lands on the apex via https://www (two hops);
# these rules do not collapse that. They are kept as an explicit statement
# of intent and as a fallback should the platform redirect ever be off.
[[redirects]]
  from = "http://northboundweb.ca/*"
  to = "https://northboundweb.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.northboundweb.ca/*"
  to = "https://northboundweb.ca/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # HSTS: one year, all subdomains, eligible for the browser preload list.
    # `preload` does nothing until the domain is submitted at hstspreload.org;
    # once accepted there, removal takes months. Every subdomain must be HTTPS.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Fingerprint-free assets: revalidate HTML, cache the rest hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No canonical redirects needed: Netlify already serves /pricing from
# pricing.html and 301s /pricing.html -> /pricing (and /index.html -> /).
# Adding forced rules for that here can loop against the same internal
# resolution, so it is deliberately left to the platform default.
